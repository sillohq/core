[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sillo = "sillo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sillo"]

[project]
name = "sillo-framework"
version = "0.0.1a14"
description = "An async Python web framework for serious APIs, web applications, real-time systems, and business backends."
authors = [
    {name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com"}
]
license = "BSD-3-Clause"
readme = "README.md"
keywords = [
    "ASGI",
    "backend",
    "framework",
    "web",
    "Python",
    "async",
    "asynchronous",
    "uvicorn",
    "web server",
    "API",
    "scalable",
    "real-time",
    "concurrent",
    "HTTP",
    "websocket"
]
requires-python = ">=3.10"
dependencies = [
    "uvicorn>=0.27.0",
    "anyio==4.14.1",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.6",
    "pydantic>=2.0,<3.0",
    "typing-extensions>=4.12.2; python_version<'3.10'",
    "passlib>=1.7.4",
    "python-dotenv>=1.0.0",
    # tomllib is 3.11+; the `sillo` command reads [tool.sillo] from
    # pyproject.toml, and that has to work on every supported version.
    "tomli>=2.0.1; python_version<'3.11'",
]

# CORE: Only includes what's required for any sillo app (HTTP routing, config, password hashing)
# All other features are optional and installed via extras (pip install 'sillo[feature]')


[project.urls]
Homepage = "https://github.com/sillohq/core"
Repository = "https://github.com/sillohq/core"
Documentation = "https://sillolabs.com"
Issues = "https://github.com/sillohq/core/issues"

[project.optional-dependencies]
# Authentication & JWT
jwt = ["pyjwt>=2.7.0"]

# Database & ORM. The floor is 1.0 because sillo.record.commands drives the
# native migration engine, which does not exist before it.
record = ["tortoise-orm>=1.0"]

# Password Hashing Algorithms (fallback to pbkdf2_sha256 if none installed)
hashing-bcrypt = ["bcrypt>=4.0.0"]
hashing-argon2 = ["argon2-cffi>=21.2.0"]
hashing-scrypt = ["scrypt>=0.8.0"]
hashing-all = [
    "bcrypt>=4.0.0",
    "argon2-cffi>=21.2.0",
    "scrypt>=0.8.0",
]

# Caching (Redis, in-memory fallback available)
cache = ["redis>=5.0.0"]

# Event Distribution (Redis, in-memory fallback available)
events = ["redis>=5.0.0"]

# HTML Templating
templating = ["jinja2>=3.1.6"]

# GraphQL Support
graphql = ["strawberry-graphql>=0.219.0"]

# The `sillo` command is a console script, not an extra: see [project.scripts]
# below. It carries the framework-level commands and, inside a project, merges
# in whatever that project's console.py registers.

# Alternative ASGI Server (uvicorn is default)
granian = ["granian>=1.2.0"]

# Convenience bundles
all = [
    "pyjwt>=2.7.0",
    "tortoise-orm>=1.0",
    "bcrypt>=4.0.0",
    "argon2-cffi>=21.2.0",
    "scrypt>=0.8.0",
    "redis>=5.0.0",
    "jinja2>=3.1.6",
    "strawberry-graphql>=0.219.0",
    "granian>=1.2.0",
    "cryptography>=41.0.0",
    "email-validator>=2.0.0",
    "python-ulid>=2.0.0",
]

dev = [
    # All features
    "pyjwt>=2.7.0",
    "tortoise-orm>=1.0",
    "bcrypt>=4.0.0",
    "argon2-cffi>=21.2.0",
    "scrypt>=0.8.0",
    "redis>=5.0.0",
    "jinja2>=3.1.6",
    "strawberry-graphql>=0.219.0",
    "granian>=1.2.0",
    "cryptography>=41.0.0",
    "email-validator>=2.0.0",
    "python-ulid>=2.0.0",
    # Testing & QA
    "exceptiongroup>=1.2.0; python_version < '3.11'",
    "pytest>=8.3.4,<9.1.0",
    "pytest-asyncio>=0.25.3,<1.5.0",
    "coverage>=6.3,<8.0",
    "httpx>=0.23.3,<0.29.0",
    "mypy>=1.15.0",
    "ruff>=0.0.256",
    "ty>=0.0.29",
    # Type stubs
    "typing-extensions==4.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--ignore=benchmarks"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
files = ["sillo"]
exclude = "(sillo/templates/.*)"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E402", "E741"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".pytest_cache",
    "htmlcov",
    "node_modules",
    "templates",
    "docs",
    "test/",
    "sandbox.py"

]
per-file-ignores = [
    "__init__.py: F401",
    "test/*: F401",
    "examples/*: F401",
    "benchmarks/*: F401"
]
max-complexity = 15

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "docker",
    "examples",
    "tests",
    "test",
    "sillo/templates",
    "docs",
    "benchmarks",
    "**/test_*.py",
    "**/tests/**",
    "**/test/**",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.8
target-version = "py38"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.isort]
known-first-party = ["sillo"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"test/*" = ["F401"]
"tests/*" = ["F401"]
"examples/*" = ["F401"]
"benchmarks/*" = ["F401"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1a14"
version_files = [
    "pyproject.toml:version",
    "sillo/__init__.py:__version__"
]
# Must match the release workflow trigger; a bare v-tag publishes nothing.
tag_format = "sillo-core-v$version"
update_changelog_on_bump = true


[tool.ty.rules]
unresolved-import = "ignore"
invalid-parameter-default = "ignore"
unused-ignore-comment = "ignore"

[dependency-groups]
# For uv: all features + testing + QA tools
dev = [
    # All optional features
    "pyjwt>=2.7.0",
    "tortoise-orm>=1.0",
    "bcrypt>=4.0.0",
    "argon2-cffi>=21.2.0",
    "scrypt>=0.8.0",
    "redis>=5.0.0",
    "jinja2>=3.1.6",
    "strawberry-graphql>=0.219.0",
    "redis>=5.0.0",
    "cryptography>=41.0.0",
    "email-validator>=2.0.0",
    "python-ulid>=2.0.0",
    # Testing & QA
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "coverage>=6.3",
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "ruff>=0.0.256",
    "ty>=0.0.29",
    # Type hints
    "typing-extensions>=4.12.2",
    # Extras
    "exceptiongroup>=1.2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sillo"
version = "0.0.1a1"
description = "An async Python web framework for serious APIs, web applications, real-time systems, and business backends."
authors = [
    {name = "Chidebele Dunamis", email = "techwithdunamix@gmail.com"}
]
license = "BSD-3-Clause"
homepage = "https://github.com/sillo-labs/sillo"
repository = "https://github.com/sillo-labs/sillo"
documentation = "https://sillolabs.com"
readme = "README.md"
keywords = [
    "ASGI",
    "backend",
    "framework",
    "web",
    "Python",
    "async",
    "asynchronous",
    "uvicorn",
    "web server",
    "API",
    "scalable",
    "real-time",
    "concurrent",
    "HTTP",
    "websocket"
]
requires-python = ">=3.10"
dependencies = [
    "uvicorn>=0.27.0",
    "anyio==4.14.1",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.6",
    "pydantic>=2.0,<3.0",
    "typing-extensions>=4.12.2; python_version<'3.10'",
]


[project.optional-dependencies]
templating = ["jinja2>=3.1.6"]
jwt = ["pyjwt>=2.7.0"]
granian = ["granian>=1.2.0"]
cli = ["click>=8.1.3"]
graphql = ["strawberry-graphql>=0.219.0"]
cache = ["redis>=5.0.0"]
events = ["redis>=5.0.0"]
record = ["tortoise-orm>=0.20.0"]


# Feature groups
http = [
    "uvicorn>=0.27.0",
    "anyio>=4.13.0",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.6"
]

all = [
    "uvicorn>=0.27.0",
    "anyio>=4.13.0",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.6",
    "pyjwt>=2.7.0",
    "click>=8.1.3",
    "strawberry-graphql>=0.219.0",
    "redis>=5.0.0",
    "tortoise-orm>=0.20.0"
]
dev = [
    "uvicorn>=0.27.0",
    "anyio>=4.13.0",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.6",
    "pyjwt>=2.7.0",
    "click>=8.1.3",
    "strawberry-graphql>=0.219.0",
    "redis>=5.0.0",
    "tortoise-orm>=0.20.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "email-validator>=2.0.0",
    "python-ulid>=2.0.0",
    "aerich>=0.7.0",
    "mypy>=1.15.0",
    "pytest>=8.3.4,<9.1.0",
    "pytest-asyncio>=0.25.3,<1.5.0",
    "coverage>=6.3,<8.0",
    "httpx>=0.23.3,<0.29.0",
    "typing-extensions==4.16.0",
    "ruff>=0.0.256",
    "ty>=0.0.29",
]

[project.scripts]
sillo = "sillo.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--ignore=benchmarks"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
files = ["sillo"]
exclude = "(sillo/templates/.*)"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E402", "E741"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".pytest_cache",
    "htmlcov",
    "node_modules",
    "templates",
    "docs",
    "test/",
    "sandbox.py"

]
per-file-ignores = [
    "__init__.py: F401",
    "test/*: F401",
    "examples/*: F401",
    "benchmarks/*: F401"
]
max-complexity = 15

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "docker",
    "examples",
    "tests",
    "test",
    "sillo/templates",
    "docs",
    "benchmarks",
    "**/test_*.py",
    "**/tests/**",
    "**/test/**",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.8
target-version = "py38"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.isort]
known-first-party = ["sillo"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"test/*" = ["F401"]
"tests/*" = ["F401"]
"examples/*" = ["F401"]
"benchmarks/*" = ["F401"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.1a1"
version_files = [
    "pyproject.toml:version",
    "sillo/__main__.py:__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true


[tool.ty.rules]
unresolved-import = "ignore"
invalid-parameter-default = "ignore"
unused-ignore-comment = "ignore"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "python-multipart>=0.0.20",
    "strawberry-graphql>=0.219.0",
    "jinja2>=3.1.6",
    "pyjwt>=2.7.0",
    "click>=8.1.3",
    "redis>=5.0.0",
    "tortoise-orm>=0.20.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "email-validator>=2.0.0",
    "python-ulid>=2.0.0",
    "aerich>=0.7.0",
    "coverage>=6.3",
    "mypy>=1.15.0",
    "ruff>=0.0.256",
    "ty>=0.0.29",
]

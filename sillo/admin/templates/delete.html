{% extends "base.html" %}
{% block content %}
<div class="delete-confirm">
    <div class="card">
        <h2>Delete {{ model_name }} #{{ object_id }}?</h2>
        <p>This action cannot be undone. All related data will be permanently removed.</p>
        <form method="POST">
            <div class="delete-actions">
                <button type="submit" class="btn btn-danger btn-lg">Yes, Delete Permanently</button>
                <a href="{{ site_prefix }}/{{ model_slug }}/{{ object_id }}/" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

[project]
name = "sillo-bench"
version = "1.0.0"
description = "The official Sillo benchmark: Sillo, FastAPI and Django under a real HTTP load generator"
readme = "README.md"
requires-python = ">=3.10"

# The suite itself needs almost nothing. Everything it measures is an extra, so
# a contributor comparing two frameworks does not have to install a third.
dependencies = [
    "uvicorn>=0.30",
]

[project.optional-dependencies]
sillo = ["sillo-framework>=0.1.0b3"]
fastapi = ["fastapi>=0.110"]
litestar = ["litestar>=2.0"]
starlette = ["starlette>=0.37"]
django = ["django>=5.0"]
# Flask is WSGI, so it needs a bridge to be served by the same uvicorn as
# everything else. See apps/flask_app.py for why that is the lesser evil.
flask = ["flask>=3.0", "a2wsgi>=1.10"]
# Everything, which is what a published run should use.
all = [
    "sillo-framework>=0.1.0b3",
    "fastapi>=0.110",
    "litestar>=2.0",
    "starlette>=0.37",
    "django>=5.0",
    "flask>=3.0",
    "a2wsgi>=1.10",
]
# uvicorn's C accelerators. Off by default: they speed up every framework
# equally, so they change the absolute numbers and not the comparison, and
# leaving them out keeps the install pure-Python and portable.
fast = ["uvloop>=0.19; sys_platform != 'win32'", "httptools>=0.6"]

[project.scripts]
sillo-bench = "sillo_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sillo_bench"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

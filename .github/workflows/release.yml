name: Release on Tag

on:
  push:
    tags:
      - 'sillo-core-v*'  # Sillo core releases: sillo-core-v0.0.1a1

jobs:
  release:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    permissions:
      contents: read        # actions/checkout needs repo read access
      id-token: write       # for OIDC (trusted publishing)

    # Without this the Redis tests skip themselves, and a release would be cut
    # on a suite that never exercised the cache, queue or pub/sub backends.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0
      SILLO_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#sillo-core-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Releasing Sillo v$VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # PyPI takes the version from the package, not the tag. Without this a
      # tag of sillo-core-v0.0.1a15 against a pyproject still saying a14
      # publishes a14 and reports success, and the version it claims to have
      # released is one that does not exist.
      #
      # `sillo.__version__` is checked too because it is what a user reads at
      # runtime, and nothing had been checking it: 0.0.1a15 shipped with the
      # module still reporting a14, and the release passed.
      - name: The tag, the package and __version__ must agree
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          PKG_VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          MOD_VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__.*?\"(.*?)\"', pathlib.Path('sillo/__init__.py').read_text()).group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION, pyproject.toml says $PKG_VERSION."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION, sillo/__init__.py says $MOD_VERSION."
            exit 1
          fi
          echo "all three say $PKG_VERSION"

      - name: Clean Old Builds
        run: |
          rm -rf dist build *.egg-info

      - name: Setup Virtual Environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

      - name: Build the package
        run: uv build

      # Prefers OIDC trusted publishing (the id-token permission above); falls
      # back to an API token when the PYPI_TOKEN secret is set. Passing an empty
      # --token is a hard failure, so the secret must not be forwarded blindly.
      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            uv publish --token "$PYPI_TOKEN"
          else
            uv publish
          fi

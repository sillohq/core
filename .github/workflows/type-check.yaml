name: Type Check

on:
  push:
    branches:
      - main
      # v1 is where the next major release is being built, and until it merges
      # nothing on it was ever tested: pushes here ran no workflow at all, so
      # the branch that changes the most had the least cover.
      - v1
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-latest
    # See run-tests.yaml: 3.15 is informational while it is a beta.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Virtual Environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run ty
        run: uv run ty check sillo